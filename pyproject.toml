[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-run-manifest"
version = "0.1.2"
description = "Build and validate eval-run provenance manifests with deterministic directory digests."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AuraOne" }]
keywords = ["llm-evaluation", "evals", "provenance", "manifest", "reproducibility", "sigstore"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Archiving",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/auraoneai/eval-run-manifest"
Documentation = "https://github.com/auraoneai/eval-run-manifest#readme"
Repository = "https://github.com/auraoneai/eval-run-manifest.git"
Issues = "https://github.com/auraoneai/eval-run-manifest/issues"
Changelog = "https://github.com/auraoneai/eval-run-manifest/blob/main/CHANGELOG.md"

[project.scripts]
eval-run-manifest = "eval_run_manifest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
